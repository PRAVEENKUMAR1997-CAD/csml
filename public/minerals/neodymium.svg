<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b3138"/>
      <stop offset="100%" stop-color="#13171b"/>
    </linearGradient>
    <radialGradient id="spot" cx="36%" cy="26%" r="58%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="48%" r="70%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.58"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f3ec"/>
      <stop offset="30%" stop-color="#b9a9c8"/>
      <stop offset="68%" stop-color="#6d615c"/>
      <stop offset="100%" stop-color="#2a2428"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#8d6ea2"/>
      <stop offset="55%" stop-color="#eee8df"/>
      <stop offset="100%" stop-color="#4c4652"/>
    </linearGradient>
    <filter id="rough" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="9"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="6"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
    </filter>
    <filter id="shadow"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#spot)"/>
  <ellipse cx="400" cy="478" rx="240" ry="26" fill="#000000" opacity="0.4" filter="url(#shadow)"/>
  <g filter="url(#rough)">
    <path d="M220 400 310 200 400 160 470 230 560 150 660 260 610 420 450 460 290 445Z" fill="url(#metal)"/>
    <path d="M330 370 395 225 480 270 425 405Z" fill="url(#chip)"/>
    <path d="M500 345 575 215 640 305 565 395Z" fill="#ddd6ec" opacity="0.55"/>
  </g>
  <rect width="800" height="600" filter="url(#grain)" opacity="0.38"/>
  <rect width="800" height="600" fill="url(#vig)"/>
</svg>
