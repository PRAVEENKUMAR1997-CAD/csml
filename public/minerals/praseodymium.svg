<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#243028"/>
      <stop offset="100%" stop-color="#101612"/>
    </linearGradient>
    <radialGradient id="spot" cx="36%" cy="26%" r="58%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="48%" r="70%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.58"/>
    </radialGradient>
    <filter id="rough" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="9"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="13"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
    </filter>
    <filter id="shadow"><feGaussianBlur stdDeviation="10"/></filter>
    
        <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f4f1d4"/>
          <stop offset="32%" stop-color="#b7c48a"/>
          <stop offset="100%" stop-color="#24301c"/>
        </linearGradient>
        <linearGradient id="face" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#e7f0c4"/>
          <stop offset="100%" stop-color="#6d7a48"/>
        </linearGradient>
        
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#spot)"/>
  <ellipse cx="400" cy="478" rx="240" ry="26" fill="#000000" opacity="0.4" filter="url(#shadow)"/>
  
        <g filter="url(#rough)">
          <path d="M190 410 300 230 420 165 530 225 660 185 700 350 590 460 300 470Z" fill="url(#metal)"/>
          <path d="M340 400 415 230 530 275 465 425Z" fill="url(#face)"/>
          <path d="M520 365 600 225 665 305 575 410Z" fill="#d7e4a6" opacity="0.75"/>
        </g>
        
  <rect width="800" height="600" filter="url(#grain)" opacity="0.38"/>
  <rect width="800" height="600" fill="url(#vig)"/>
</svg>
